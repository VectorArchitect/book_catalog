<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>My Book Catalog</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    /* style.css (kept short and clear) */
    :root{--card-bg:#0f1724;--accent:#facc15;--muted:#94a3b8}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;margin:0;background:#071022;color:#e6eef8;padding:24px}
    header{display:flex;gap:12px;align-items:center;margin-bottom:18px}
    h1{margin:0;font-size:1.3rem}
    .controls{margin-left:auto;display:flex;gap:8px;align-items:center}
    input[type="search"], select{padding:8px;border-radius:6px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.02);color:inherit}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
    .card{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));padding:12px;border-radius:10px;box-shadow:0 6px 18px rgba(2,6,23,0.6)}
    .card h3{margin:0 0 6px 0;font-size:1.05rem}
    .meta{color:var(--muted);font-size:0.9rem;margin-bottom:8px}
    .tags{display:flex;gap:6px;flex-wrap:wrap}
    .tag{font-size:0.75rem;padding:4px 8px;border-radius:999px;background:rgba(255,255,255,0.03)}
    button.icon{background:none;border:none;color:var(--accent);cursor:pointer;font-size:1.1rem}
    .footer{margin-top:12px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:0.9rem}
    /* modal */
    .modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.5)}
    .modal .box{background:#071428;padding:18px;border-radius:10px;max-width:520px;width:90%}
    .favorites-btn{background:transparent;border:1px dashed var(--accent);padding:6px 10px;border-radius:8px;color:var(--accent);cursor:pointer}
    @media (max-width:480px){header{flex-direction:column;align-items:flex-start}.controls{margin-left:0;width:100%}}
  </style>
</head>
<body>

<header>
  <h1>My Book Catalog</h1>
  <div class="controls">
    <input id="search" type="search" placeholder="Search by title or author" />
    <select id="genreFilter">
      <option value="">All genres</option>
    </select>
    <button id="showFav" class="favorites-btn">Show Favorites</button>
  </div>
</header>

<main>
  <div id="grid" class="grid"></div>
  <p id="empty" style="color:#9aa7b8;display:none;margin-top:14px">No books found.</p>
</main>

<!-- Modal for details -->
<div id="modal" class="modal" role="dialog" aria-hidden="true">
  <div class="box">
    <button id="closeModal" style="float:right;background:none;border:none;color:var(--muted);font-size:1.1rem">✕</button>
    <h2 id="modalTitle"></h2>
    <p id="modalAuthor" class="meta"></p>
    <p id="modalDesc" style="line-height:1.5"></p>
    <div style="margin-top:12px;text-align:right">
      <button id="favModalBtn" class="favorites-btn">Add to Favorites</button>
    </div>
  </div>
</div>

<!-- XML data embedded so no server needed -->
<script id="booksData" type="application/xml">
<library>
  <book id="b1">
    <title>Clean Code</title>
    <author>Robert C. Martin</author>
    <genre>Programming</genre>
    <year>2008</year>
    <summary>A handbook of agile software craftsmanship and healthy coding practices.</summary>
  </book>
  <book id="b2">
    <title>Introduction to Algorithms</title>
    <author>Thomas H. Cormen</author>
    <genre>Algorithms</genre>
    <year>2009</year>
    <summary>Comprehensive text on algorithms used in computer science courses.</summary>
  </book>
  <book id="b3">
    <title>The Alchemist</title>
    <author>Paulo Coelho</author>
    <genre>Fiction</genre>
    <year>1988</year>
    <summary>A poetic story about following your dreams.</summary>
  </book>
  <book id="b4">
    <title>Design Patterns</title>
    <author>Erich Gamma</author>
    <genre>Programming</genre>
    <year>1994</year>
    <summary>Classic book introducing software design patterns.</summary>
  </book>
</library>
</script>

<script>
  // script.js (simple and commented for you to explain)
  const xmlText = document.getElementById('booksData').textContent.trim();
  const parser = new DOMParser();
  const xml = parser.parseFromString(xmlText, "application/xml");
  const books = Array.from(xml.querySelectorAll('book')).map(b => ({
    id: b.getAttribute('id'),
    title: b.querySelector('title')?.textContent || '',
    author: b.querySelector('author')?.textContent || '',
    genre: b.querySelector('genre')?.textContent || '',
    year: b.querySelector('year')?.textContent || '',
    summary: b.querySelector('summary')?.textContent || ''
  }));

  // DOM refs
  const grid = document.getElementById('grid');
  const search = document.getElementById('search');
  const genreFilter = document.getElementById('genreFilter');
  const empty = document.getElementById('empty');
  const modal = document.getElementById('modal');
  const modalTitle = document.getElementById('modalTitle');
  const modalAuthor = document.getElementById('modalAuthor');
  const modalDesc = document.getElementById('modalDesc');
  const closeModal = document.getElementById('closeModal');
  const favModalBtn = document.getElementById('favModalBtn');
  const showFav = document.getElementById('showFav');

  // favorites stored in localStorage
  const FAVORITES_KEY = 'my_book_favs';
  function loadFavs(){ return JSON.parse(localStorage.getItem(FAVORITES_KEY) || '[]'); }
  function saveFavs(arr){ localStorage.setItem(FAVORITES_KEY, JSON.stringify(arr)); }

  // populate genre filter options
  const genres = [...new Set(books.map(b => b.genre).filter(Boolean))];
  genres.forEach(g=>{
    const opt = document.createElement('option');
    opt.value = g; opt.textContent = g;
    genreFilter.appendChild(opt);
  });

  // render function
  function render(list){
    grid.innerHTML = '';
    if(list.length === 0){ empty.style.display = 'block'; return; } else empty.style.display = 'none';
    const favs = loadFavs();
    list.forEach(b=>{
      const card = document.createElement('article');
      card.className = 'card';
      card.innerHTML = `
        <h3>${escapeHtml(b.title)}</h3>
        <div class="meta">${escapeHtml(b.author)} • ${escapeHtml(b.year)}</div>
        <div class="tags"><span class="tag">${escapeHtml(b.genre)}</span></div>
        <div class="footer">
          <small>${b.summary.slice(0,70)}${b.summary.length>70?'...':''}</small>
          <div>
            <button class="icon" title="View details" data-id="${b.id}">🔍</button>
            <button class="icon" title="Toggle favorite" data-fav="${b.id}">${favs.includes(b.id)?'★':'☆'}</button>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  // helpers
  function escapeHtml(s){ return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;'); }

  // initial render
  render(books);

  // search + filter logic
  function filterBooks(){
    const q = search.value.trim().toLowerCase();
    const genre = genreFilter.value;
    let list = books.filter(b=>{
      const matchQ = !q || b.title.toLowerCase().includes(q) || b.author.toLowerCase().includes(q);
      const matchGenre = !genre || b.genre === genre;
      return matchQ && matchGenre;
    });
    render(list);
  }

  search.addEventListener('input', filterBooks);
  genreFilter.addEventListener('change', filterBooks);

  // delegate clicks in grid
  grid.addEventListener('click', e=>{
    const id = e.target.dataset.id;
    const favId = e.target.dataset.fav;
    if(id){
      const book = books.find(x=>x.id===id);
      showDetails(book);
    } else if(favId){
      toggleFav(favId);
      filterBooks(); // re-render to update star
    }
  });

  function showDetails(book){
    modalTitle.textContent = book.title;
    modalAuthor.textContent = `${book.author} • ${book.genre} • ${book.year}`;
    modalDesc.textContent = book.summary;
    favModalBtn.dataset.id = book.id;
    const favs = loadFavs();
    favModalBtn.textContent = favs.includes(book.id) ? 'Remove from Favorites' : 'Add to Favorites';
    modal.style.display = 'flex';
    modal.setAttribute('aria-hidden','false');
  }

  closeModal.addEventListener('click', ()=>{ modal.style.display='none'; modal.setAttribute('aria-hidden','true'); });

  favModalBtn.addEventListener('click', e=>{
    const id = e.target.dataset.id;
    toggleFav(id);
    closeModal.click();
    filterBooks();
  });

  function toggleFav(id){
    const favs = loadFavs();
    const idx = favs.indexOf(id);
    if(idx === -1) favs.push(id); else favs.splice(idx,1);
    saveFavs(favs);
  }

  // show favorites view
  let favMode = false;
  showFav.addEventListener('click', ()=>{
    favMode = !favMode;
    if(favMode){
      showFav.textContent = 'Show All';
      const favs = loadFavs();
      const list = books.filter(b => favs.includes(b.id));
      render(list);
    } else {
      showFav.textContent = 'Show Favorites';
      render(books);
    }
  });

  // close modal on outside click
  modal.addEventListener('click', e=>{ if(e.target===modal) closeModal.click(); });

</script>
</body>
</html>
